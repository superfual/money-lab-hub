<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111b20">
  <title>Fual Money Lab</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#101b20;color:#edf4ee;font:16px system-ui,-apple-system,sans-serif}main{max-width:520px;margin:auto;padding:26px 22px 48px}.top{display:flex;justify-content:space-between;align-items:center;color:#a5bcb4;font-size:12px;letter-spacing:.1em}.top-right{display:flex;align-items:center;gap:8px}.badge{border:1px solid #3a594f;border-radius:20px;padding:7px 11px;color:#b9e9ca}.language{display:flex;background:#182723;border:1px solid #355047;border-radius:18px;padding:2px}.language button{width:auto;padding:5px 8px;border-radius:13px;background:transparent;color:#8da39a;font-size:11px}.language button.active{background:#bcedb8;color:#10261b}.tag{color:#a8e9bc;font-size:12px;letter-spacing:.15em;font-weight:700;margin-top:54px}h1{font-size:46px;line-height:1.03;letter-spacing:-.05em;margin:18px 0}p{line-height:1.65;color:#b9c9c2}.hero{background:#1d322e;border:1px solid #35584c;border-radius:25px;padding:22px;margin:28px 0}.hero small{color:#a4bfb1}.money{font-size:39px;font-weight:750;color:#c6f3cf;margin:8px 0}.pill{font-size:12px;color:#d8eadc;background:#324b40;border-radius:15px;padding:6px 10px;display:inline-block}.button,button{width:100%;border:0;border-radius:14px;padding:17px;background:#c0efbc;color:#10261b;font-weight:750;font-size:16px;cursor:pointer}.quiet{background:transparent;color:#b8dbbd;border:1px solid #436251;margin-top:14px}.progress{height:5px;background:#34483f;border-radius:5px;margin:26px 0}.progress i{display:block;width:50%;height:5px;background:#bcedb8}.option{display:block;width:100%;text-align:left;background:#1d302b;color:#eef6ed;border:1px solid #3b594a;border-radius:16px;padding:17px;margin:12px 0;font-weight:500;line-height:1.5}.option:hover{border-color:#bcedb8}.choice{font-weight:700;color:#c7eccb;display:block;margin-bottom:5px}.result{border-left:3px solid #bcedb8;padding-left:16px}.proof,.circuit{background:#121f1c;border:1px solid #2d493f;border-radius:16px;padding:15px;margin-top:18px}.proof-row{display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;background:#b8ed82;border-radius:50%;box-shadow:0 0 12px #a6e86d;flex:0 0 auto}.dot.pending{background:#f2c96d;box-shadow:0 0 12px #d9a949}.proof strong,.circuit strong{font-size:13px}.proof code,.circuit code{display:block;color:#88a99a;font-size:11px;overflow-wrap:anywhere;margin-top:7px}.logic{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0;color:#dff4df;font:700 12px ui-monospace,monospace}.logic span{border:1px solid #46685a;border-radius:8px;padding:7px 8px}.logic b{color:#bcedb8}.meta{font-size:12px;line-height:1.6;color:#8fa99d}.foot{font-size:12px;color:#8fa49b;margin-top:28px}strong{color:#e5f4e6}.error{background:#39201f;border:1px solid #82433f;padding:18px;border-radius:16px;margin-top:30px}.loading{margin-top:90px;color:#a8c0b6}@media(max-width:390px){.badge{display:none}h1{font-size:42px}}
  </style>
</head>
<body>
  <main>
    <div class="top"><span>FUAL / MONEY LAB</span><div class="top-right"><span class="badge" id="versionBadge">BẢN CHƠI THỬ 04</span><div class="language"><button id="viButton" onclick="changeLanguage('vi')">VI</button><button id="enButton" onclick="changeLanguage('en')">EN</button></div></div></div>
    <div id="app"><p class="loading">Đang kiểm tra gói nội dung…</p></div>
  </main>
  <script>
    const app = document.querySelector('#app');
    const ui = {
      vi: {
        htmlLang:'vi', badge:'BẢN CHƠI THỬ 04', loading:'Đang kiểm tra gói nội dung…', verified:'Gói nội dung tiếng Việt đã khớp SHA-256', circuitTitle:'Mạch bảo toàn vốn', circuitStatus:'Thiết kế đã sẵn sàng · Chờ tape out on-chain', circuitRule:'DỪNG khi cả quỹ dự phòng đã cạn và giới hạn chi tiêu đã bị vượt', processor:'Processor',
        homeTag:'HỌC TỪ NHỮNG LỰA CHỌN', homeTitle:'Tiền của bạn.<br>Quyết định của bạn.', homeText:'Một trải nghiệm ngắn giúp bạn hiểu vì sao giữ lại tiền dự phòng cũng là một quyết định quản lý vốn.', capital:'SỐ VỐN BẮT ĐẦU', fake:'Tiền giả lập · Không cần ví', start:'Bắt đầu trải nghiệm →', duration:'Khoảng 2 phút',
        scenario:'TÌNH HUỐNG 01', questionBefore:'Bạn sẽ chia', questionAfter:'thế nào?', variableNote:'Phần đầu tư được giả định có thể tăng hoặc giảm.', invest:'đầu tư', reserve:'dự phòng', rules:'Quy tắc được đọc từ gói nội dung đã kiểm chứng.',
        result:'KẾT QUẢ GIẢ LẬP · PHƯƠNG ÁN', resultTitle:'Thị trường giảm.<br>Cuộc sống vẫn tiếp diễn.', assumption:'Giả sử bạn dùng tiền dự phòng trước và bán tài sản nếu còn thiếu.', assets:'TÀI SẢN CÒN LẠI SAU CHI PHÍ', investmentLeft:'Đầu tư còn', cashLeft:'Tiền dự phòng còn', forcedSale:'Phải bán tài sản đang giảm', soldHeadline:'Bạn phải bán một phần tài sản khi giá đang giảm', cashHeadline:'Bạn dùng được tiền dự phòng', soldLesson:'Khi không đủ tiền mặt, chi phí bất ngờ có thể buộc bạn bán tài sản vào lúc bất lợi.', cashLesson:'Tiền dự phòng giúp bạn xử lý chi phí mà chưa cần bán khoản đầu tư đang giảm.', retry:'Thử phương án khác ↺', home:'Về trang đầu', pending:'Dữ liệu đã được kiểm chứng bằng SHA-256 · Chưa công bố lên TapeOut', loadError:'Không thể xác minh nội dung', stopped:'Trò chơi tạm dừng để tránh dùng sai dữ liệu.'
      },
      en: {
        htmlLang:'en', badge:'PLAYABLE PROTOTYPE 04', loading:'Verifying content package…', verified:'English content package matches SHA-256', circuitTitle:'Capital Survival Gate', circuitStatus:'Design ready · Awaiting on-chain tape-out', circuitRule:'STOP when both the emergency reserve is depleted and the spending limit is breached', processor:'Processor',
        homeTag:'LEARN FROM YOUR CHOICES', homeTitle:'Your money.<br>Your decisions.', homeText:'A short experience that shows why keeping an emergency reserve is part of capital management.', capital:'STARTING CAPITAL', fake:'Simulated money · No wallet required', start:'Start the experience →', duration:'About 2 minutes',
        scenario:'SCENARIO 01', questionBefore:'How will you allocate', questionAfter:'?', variableNote:'The invested amount is assumed to rise or fall with the market.', invest:'invested', reserve:'in reserve', rules:'Rules are loaded from a verified content package.',
        result:'SIMULATION RESULT · CHOICE', resultTitle:'The market falls.<br>Life keeps moving.', assumption:'Assume you use cash reserves first and sell investments to cover any shortfall.', assets:'ASSETS LEFT AFTER THE EXPENSE', investmentLeft:'Investment remaining', cashLeft:'Cash reserve remaining', forcedSale:'Assets sold during the downturn', soldHeadline:'You must sell part of your investment during a downturn', cashHeadline:'Your emergency fund covers the expense', soldLesson:'Without enough cash, an unexpected expense can force you to sell assets at an unfavorable time.', cashLesson:'An emergency fund lets you cover the expense without selling an investment during a downturn.', retry:'Try another choice ↺', home:'Back to start', pending:'Content verified with SHA-256 · Not yet published to TapeOut', loadError:'Unable to verify content', stopped:'The game has stopped to avoid using incorrect data.'
      }
    };
    let lang = localStorage.getItem('moneyLabLanguage') || (navigator.language.toLowerCase().startsWith('vi') ? 'vi' : 'en');
    let scenario;
    let proof;
    let circuit;
    let circuitProof;
    let screen = 'home';
    const money = value => new Intl.NumberFormat('en-US', {maximumFractionDigits:0}).format(value);
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const t = key => ui[lang][key];

    function updateChrome() {
      document.documentElement.lang = t('htmlLang');
      document.querySelector('#versionBadge').textContent = t('badge');
      document.querySelector('#viButton').classList.toggle('active', lang === 'vi');
      document.querySelector('#enButton').classList.toggle('active', lang === 'en');
    }
    function proofCard() {
      return `<div class="proof"><div class="proof-row"><span class="dot"></span><strong>${t('verified')}</strong></div><code>${proof.sha256}</code></div>`;
    }
    function circuitCard() {
      const published=circuit.publication.status==='published';
      const status=published ? `Circuit #${escapeHtml(circuit.publication.circuitId)}` : t('circuitStatus');
      return `<div class="circuit"><div class="proof-row"><span class="dot ${published?'':'pending'}"></span><strong>${t('circuitTitle')}</strong></div><div class="logic"><span>IN0</span><span>IN1</span><b>→ NAND →</b><span>OUT0</span></div><p class="meta">${t('circuitRule')}<br>${t('processor')}: ${escapeHtml(circuit.processor.name)} #${circuit.processor.processorNumber} · X Layer</p><code>SHA-256 ${circuitProof.sha256}</code><code>${status}</code></div>`;
    }
    function home() {
      screen = 'home';
      app.innerHTML = `<div class="tag">${t('homeTag')}</div><h1>${t('homeTitle')}</h1><p>${t('homeText')}</p><div class="hero"><small>${t('capital')}</small><div class="money">$${money(scenario.initialCapital)}</div><span class="pill">${t('fake')}</span></div><button onclick="play()">${t('start')}</button>${circuitCard()}${proofCard()}<p class="foot">${t('duration')} · ${escapeHtml(scenario.disclaimer)}</p>`;
    }
    function play() {
      screen = 'play';
      const buttons = scenario.choices.map((choice,index) => `<button class="option" onclick="showResult(${index})"><span class="choice">${escapeHtml(choice.id)} · ${escapeHtml(choice.label)}</span>$${money(choice.investment)} ${t('invest')} · $${money(choice.cashReserve)} ${t('reserve')}</button>`).join('');
      app.innerHTML = `<div class="tag">${t('scenario')} / ${escapeHtml(scenario.title.toUpperCase())}</div><div class="progress"><i></i></div><h1>${t('questionBefore')}<br>$${money(scenario.initialCapital)} ${t('questionAfter')}</h1><p>${escapeHtml(scenario.prompt)} ${t('variableNote')}</p>${buttons}<p class="foot">${t('rules')}</p>`;
    }
    function showResult(index) {
      screen = `result:${index}`;
      const choice=scenario.choices[index], market=scenario.events.find(e=>e.type==='investment_return'), expense=scenario.events.find(e=>e.type==='unexpected_expense');
      const after=choice.investment*(1+market.rate), cashUsed=Math.min(choice.cashReserve,expense.amount), sale=Math.max(0,expense.amount-cashUsed), investmentLeft=Math.max(0,after-sale), cashLeft=choice.cashReserve-cashUsed, total=investmentLeft+cashLeft;
      const headline=sale>0?t('soldHeadline'):t('cashHeadline'), lesson=sale>0?t('soldLesson'):t('cashLesson');
      app.innerHTML = `<div class="tag">${t('result')} ${escapeHtml(choice.id)}</div><div class="progress"><i style="width:100%"></i></div><h1>${t('resultTitle')}</h1><p>${escapeHtml(market.description)} ${escapeHtml(expense.description)} ${t('assumption')}</p><div class="hero"><small>${t('assets')}</small><div class="money">$${money(total)}</div><p>${t('investmentLeft')}: $${money(investmentLeft)}<br>${t('cashLeft')}: $${money(cashLeft)}<br>${t('forcedSale')}: $${money(sale)}</p></div><div class="result"><strong>${headline}</strong><p>${lesson} ${escapeHtml(scenario.learningGoal)}</p></div><button onclick="play()">${t('retry')}</button><button class="quiet" onclick="home()">${t('home')}</button>${proofCard()}<p class="foot">${t('pending')}</p>`;
    }
    async function sha256(text) {
      const data=new TextEncoder().encode(text);
      if(globalThis.crypto?.subtle) {
        const digest=await crypto.subtle.digest('SHA-256',data);
        return [...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,'0')).join('');
      }
      const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
      const bits=data.length*8, size=Math.ceil((data.length+9)/64)*64, padded=new Uint8Array(size);
      padded.set(data); padded[data.length]=0x80;
      const view=new DataView(padded.buffer);
      view.setUint32(size-8,Math.floor(bits/0x100000000)); view.setUint32(size-4,bits>>>0);
      const h=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19], w=new Uint32Array(64), rotr=(x,n)=>(x>>>n)|(x<<(32-n));
      for(let offset=0;offset<size;offset+=64){
        for(let i=0;i<16;i++) w[i]=view.getUint32(offset+i*4);
        for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2],s0=rotr(a,7)^rotr(a,18)^(a>>>3),s1=rotr(b,17)^rotr(b,19)^(b>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;}
        let [a,b,c,d,e,f,g,hh]=h;
        for(let i=0;i<64;i++){const s1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(hh+s1+ch+K[i]+w[i])>>>0,s0=rotr(a,2)^rotr(a,13)^rotr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(s0+maj)>>>0;hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}
        h[0]=(h[0]+a)>>>0;h[1]=(h[1]+b)>>>0;h[2]=(h[2]+c)>>>0;h[3]=(h[3]+d)>>>0;h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0;
      }
      return h.map(value=>value.toString(16).padStart(8,'0')).join('');
    }
    async function loadLanguage() {
      updateChrome();
      app.innerHTML = `<p class="loading">${t('loading')}</p>`;
      try {
        const manifestResponse=await fetch('./content/manifest.json',{cache:'no-store'});
        if(!manifestResponse.ok) throw new Error(t('loadError'));
        const manifest=await manifestResponse.json();
        proof=manifest.files.find(file=>file.language===lang);
        if(!proof) throw new Error(t('loadError'));
        const scenarioResponse=await fetch(`.${proof.path}`,{cache:'no-store'});
        if(!scenarioResponse.ok) throw new Error(t('loadError'));
        const raw=await scenarioResponse.text(), actualHash=await sha256(raw);
        if(actualHash!==proof.sha256) throw new Error(t('loadError'));
        scenario=JSON.parse(raw);
        circuitProof=manifest.files.find(file=>file.role==='circuit-spec');
        if(!circuitProof) throw new Error(t('loadError'));
        const circuitResponse=await fetch(`.${circuitProof.path}`,{cache:'no-store'});
        if(!circuitResponse.ok) throw new Error(t('loadError'));
        const circuitRaw=await circuitResponse.text(), circuitHash=await sha256(circuitRaw);
        if(circuitHash!==circuitProof.sha256) throw new Error(t('loadError'));
        circuit=JSON.parse(circuitRaw);
        if(screen.startsWith('result:')) showResult(Number(screen.split(':')[1])); else if(screen==='play') play(); else home();
      } catch(error) {
        app.innerHTML=`<div class="error"><strong>${t('loadError')}</strong><p>${escapeHtml(error.message)}. ${t('stopped')}</p></div>`;
      }
    }
    async function changeLanguage(next) {
      if(next===lang) return;
      lang=next;
      localStorage.setItem('moneyLabLanguage',lang);
      await loadLanguage();
    }
    loadLanguage();
  </script>
</body>
</html>
