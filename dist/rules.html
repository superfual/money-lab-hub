<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Money Lab Hub — Rules</title><link rel="stylesheet" href="./board.css"><link rel="stylesheet" href="./world-tabs.css"><link rel="stylesheet" href="./emerald-theme.css?v=1.1"></head><body><header><a class="brand" href="./">MONEY LAB HUB</a><nav><a href="./" id="back">Về bàn cờ</a><div class="languages"><button id="vi">VI</button><button id="en">EN</button></div></nav></header><main class="guide-page" id="guide"></main><script type="module">import {guideHTML} from './guide.mjs';let lang=localStorage.getItem('moneyLabLanguage')==='en'?'en':'vi';function render(){document.documentElement.lang=lang;document.querySelector('#guide').innerHTML=guideHTML(lang);document.querySelector('#back').textContent=lang==='vi'?'Về bàn cờ':'Back to board';for(const l of ['vi','en'])document.querySelector('#'+l).classList.toggle('active',l===lang);}for(const l of ['vi','en'])document.querySelector('#'+l).onclick=()=>{lang=l;try{localStorage.setItem('moneyLabLanguage',l);}catch{}render();};render();</script><script type="module" src="./world-nav.mjs"></script></body></html>
